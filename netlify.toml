# Netlify: build the Vite app and serve dist/. Routes are hash-based (#/news),
# so no SPA redirect rule is needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed build files never change, so let browsers keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
